<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Nika</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: #16171b; color: #e8e8ea; display: flex; height: 100vh; }
  #sidebar { width: 190px; border-right: 1px solid #2a2b31; padding: 12px 0; }
  #sidebar button { display: block; width: 100%; text-align: left; background: none; border: none; color: #c7c8cd; padding: 10px 16px; cursor: pointer; font-size: 14px; }
  #sidebar button.active, #sidebar button:hover { background: #24252b; color: #fff; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #statusbar { padding: 8px 16px; border-bottom: 1px solid #2a2b31; font-size: 12px; color: #9a9ba3; }
  #view { flex: 1; overflow-y: auto; padding: 16px; }
  #chatlog { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 10px; line-height: 1.4; font-size: 14px; }
  .msg.user { align-self: flex-end; background: #3a5a9c; }
  .msg.nika { align-self: flex-start; background: #2a2b31; }
  .typing { align-self: flex-start; background: #2a2b31; padding: 8px 12px; border-radius: 10px; font-size: 14px; color: #9a9ba3; }
  .typing .dot { animation: blink 1.2s infinite; }
  .typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  #logview { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
  #logview .stderr { color: #e07a7a; }
  #logview .stdout { color: #a9abb3; }
  .card { align-self: flex-start; max-width: 70%; background: #332a1a; border: 1px solid #6b5a2c; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .card .reason { color: #c9b98a; margin: 4px 0 8px; }
  .card button { margin-right: 8px; padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; }
  .card .yes { background: #3f7a4f; color: #fff; }
  .card .no { background: #7a3f3f; color: #fff; }
  #inputbar { display: flex; padding: 12px; border-top: 1px solid #2a2b31; gap: 8px; }
  #inputbar input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3b42; background: #1e1f24; color: #eee; font-size: 14px; }
  #inputbar button { padding: 10px 16px; border-radius: 8px; border: none; background: #3a5a9c; color: #fff; cursor: pointer; }
  #micbtn { background: #2a2b31; }
  #micbtn.recording { background: #7a3f3f; }
  #speakerbtn { background: #2a2b31; }
  #speakerbtn.muted { opacity: 0.4; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2b31; }
  h2 { font-size: 15px; color: #c7c8cd; margin: 0 0 12px; }
</style>
</head>
<body>
  <div id="sidebar">
    <button data-view="chat" class="active">Chat</button>
    <button data-view="goals">Goals</button>
    <button data-view="mission">Mission</button>
    <button data-view="memory">Memory</button>
    <button data-view="decisions">Decisions</button>
    <button data-view="logs">Logs</button>
  </div>
  <div id="main">
    <div id="statusbar">connecting…</div>
    <div id="view"></div>
    <div id="inputbar">
      <input id="chatinput" placeholder="Message Nika…" />
      <button id="micbtn" title="Hold to talk">🎤</button>
      <button id="speakerbtn" title="Toggle spoken replies">🔊</button>
      <button id="sendbtn">Send</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
